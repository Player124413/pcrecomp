name: Shrek 2 (Windows x86)

# The lift is derived from the shipping game.exe, which is copyrighted and is
# not in this repository.  The `lift` job therefore fetches the one file it
# needs (System/game.exe, 274 KB) from the public files repository and
# regenerates the C on every run.  The Windows job then builds the executable
# from that artifact -- so what is tested is what the driver produces from the
# real binary, not a stale copy checked in by hand.
#
# The repository is overridable for a fork or a private mirror:
#   workflow_dispatch -> files_repository / files_ref

on:
  push:
    branches: [main]
    paths:
      - "projects/shrek2/**"
      - "runtime/native32/**"
      - "runtime/recomp32/**"
      - "tools/**"
      - ".github/workflows/shrek2-windows.yml"
  pull_request:
    paths:
      - "projects/shrek2/**"
      - "runtime/native32/**"
      - "runtime/recomp32/**"
      - "tools/**"
      - ".github/workflows/shrek2-windows.yml"
  workflow_dispatch:
    inputs:
      files_repository:
        description: "repository holding the game (System/game.exe)"
        default: "Player124413/Files"
      files_ref:
        description: "branch or tag in that repository"
        default: "main"
  release:
    types: [published]

concurrency:
  group: shrek2-${{ github.ref }}
  cancel-in-progress: true

env:
  FILES_REPOSITORY: ${{ inputs.files_repository || 'Player124413/Files' }}
  FILES_REF: ${{ inputs.files_ref || 'main' }}
  LIFT_DIR: projects/shrek2/src/game/recomp/gen

jobs:
  # ---------------------------------------------------------------------------
  # 1. Regenerate the lift from the original binary, and gate it.
  # ---------------------------------------------------------------------------
  lift:
    name: lift game.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The clone below is of a *different* repository.  checkout persists
          # an auth header scoped to this repository's GITHUB_TOKEN; sending it
          # to github.com/<someone-else>/... gets a 403 instead of falling back
          # to anonymous read, even for a public repo.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/shrek2/requirements.txt

      - name: Install the disassembler
        run: pip install -r projects/shrek2/requirements.txt

      - name: Fetch the one file the lift is generated from
        env:
          FILES_TOKEN: ${{ secrets.FILES_TOKEN }}   # empty for the public repo
        run: |
          set -euo pipefail
          AUTH=()
          if [ -n "${FILES_TOKEN:-}" ]; then
            URL="https://api.github.com/repos/${FILES_REPOSITORY}/contents/System/game.exe?ref=${FILES_REF}"
            AUTH=(-H "Authorization: Bearer ${FILES_TOKEN}" -H "Accept: application/vnd.github.raw")
          else
            URL="https://raw.githubusercontent.com/${FILES_REPOSITORY}/${FILES_REF}/System/game.exe"
          fi
          curl -fL --retry 3 --retry-delay 2 -o "${RUNNER_TEMP}/game.exe" "${AUTH[@]}" "$URL"
          ls -l "${RUNNER_TEMP}/game.exe"
          sha256sum "${RUNNER_TEMP}/game.exe"   # the driver checks it against config/game.json

      - name: Lift (run 1)
        run: |
          python3 projects/shrek2/tools/build_lift.py \
            --game "${RUNNER_TEMP}/game.exe" \
            --out "${LIFT_DIR}" \
            --analysis projects/shrek2/analysis | tee lift.log

      - name: Lift (run 2) and compare -- the lift must be reproducible
        run: |
          set -euo pipefail
          python3 projects/shrek2/tools/build_lift.py \
            --game "${RUNNER_TEMP}/game.exe" \
            --out "${RUNNER_TEMP}/lift2" \
            --analysis "${RUNNER_TEMP}/analysis2" > /dev/null
          diff -r "${LIFT_DIR}" "${RUNNER_TEMP}/lift2"
          echo "the two runs produced byte-identical C"

      - name: Host gate (an independent compiler's opinion, before MSVC)
        run: |
          set -euo pipefail
          # Zig ships a full 32-bit Windows (mingw) toolchain; compiling main.c
          # against real Windows headers catches host bugs in a minute instead
          # of after the MSVC job has built 14.5 MB of generated C.
          pip install -q ziglang
          ZIG=$(python3 -c "import ziglang,os;print(os.path.dirname(ziglang.__file__))")/zig
          "$ZIG" cc -target x86-windows-gnu -std=gnu11 -c -w \
            -I runtime/recomp32 -I runtime/native32 -I "${LIFT_DIR}" \
            -o /tmp/host.o projects/shrek2/src/main.c
          echo "host compiles for x86-windows"

      - name: Ship the report with the generated code
        run: cp projects/shrek2/analysis/report.md "${LIFT_DIR}/lift-report.md"

      - name: Compile gate (syntax, before paying for an MSVC build)
        run: |
          set -euo pipefail
          for f in "${LIFT_DIR}"/recomp_*.c "${LIFT_DIR}"/recomp_dispatch.c; do
            gcc -fsyntax-only -w -I runtime/recomp32 "$f"
          done
          echo "all generated translation units parse"

      - name: Upload the lift
        uses: actions/upload-artifact@v4
        with:
          # One directory, so the artifact's root *is* the gen dir and the
          # Windows job can download it straight into place.  The report rides
          # along inside it.
          name: shrek2-lift
          path: ${{ env.LIFT_DIR }}
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Build the Windows executable with MSVC, x86.
  # ---------------------------------------------------------------------------
  windows:
    name: build shrek2.exe (Win32)
    needs: lift
    runs-on: windows-latest
    permissions:
      contents: write        # only the release step needs it

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Fetch the generated lift
        uses: actions/download-artifact@v4
        with:
          name: shrek2-lift
          path: ${{ env.LIFT_DIR }}

      - name: Configure (Visual Studio 2022, x86)
        run: cmake -S projects/shrek2 -B build -G "Visual Studio 17 2022" -A Win32

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/shrek2.exe dist/
          Copy-Item projects/shrek2/README.md dist/README.md
          if (Test-Path "${{ env.LIFT_DIR }}/recomp_target.h") {
            Copy-Item "${{ env.LIFT_DIR }}/recomp_target.h" dist/recomp_target.h
          }
          Compress-Archive -Path dist/* -DestinationPath shrek2-win32.zip -Force
          Get-Item dist/shrek2.exe, shrek2-win32.zip | Format-Table Name, Length

      - name: Upload the executable
        uses: actions/upload-artifact@v4
        with:
          name: shrek2-win32
          path: |
            dist/shrek2.exe
            shrek2-win32.zip
          if-no-files-found: error
          retention-days: 30

      - name: Attach to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" shrek2-win32.zip --clobber
